<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CardSearch — Your card lists</title>
  <link rel="stylesheet" href="styles.css">
  <script src="app.js" defer></script>
</head>
<body>
  <header><a class="brand" href="./"><span aria-hidden="true">♠</span> CardSearch</a><span class="badge">Card lists</span></header>
  <main>
    <section class="list-section" aria-labelledby="list-heading">
      <div class="results-heading"><h2 id="list-heading">Your card lists</h2><button id="new-list" type="button" class="secondary-button">New list</button></div>
      <p class="section-description">Paste one card per line. For example, 2 Mountain (FRA) 393 means two copies of Mountain.</p>
      <form id="card-list-form" class="list-form">
        <h3 id="list-form-heading">Add a list</h3>
        <label for="list-name">List name <span class="optional">(optional)</span></label>
        <input id="list-name" name="name" placeholder="My Commander deck" autocomplete="off">
        <label for="list-text">Card list</label>
        <textarea id="list-text" name="cardsText" rows="9" required placeholder="1 Sol Ring&#10;1 Arcane Signet&#10;10 Forest" aria-describedby="list-hint"></textarea>
        <p id="list-hint" class="field-hint">Paste as many cards as you need. Blank lines and duplicates are preserved.</p>
        <div class="list-actions"><button id="save-list" type="submit">Add list</button><button id="cancel-edit" type="button" class="secondary-button" hidden>Cancel edit</button><p id="save-status" role="status" aria-live="polite"></p></div>
      </form>
      <div class="results-heading"><h3>Saved lists</h3><button id="refresh-lists" type="button" class="secondary-button">Refresh</button></div>
      <p id="lists-status" role="status" aria-live="polite"></p>
      <div id="saved-lists" class="saved-lists"></div>
    </section>
  </main>
  <footer>CardSearch <span>Your lists, saved and ready for the next game.</span></footer>
</body>
</html>
