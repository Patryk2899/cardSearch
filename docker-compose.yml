services:
  app:
    build:
      context: .
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    environment:
      SERVER_PORT: "8080"
      JAVA_TOOL_OPTIONS: "${JAVA_TOOL_OPTIONS:--XX:MaxRAMPercentage=75.0}"
      CARDS_DATABASE_PATH: /app/data/cards.db
      CARDS_IMPORT_PATH: /seed/default-cards-20261008090544.jsonl
      CARDS_IMPORT_ENABLED: "${CARDS_IMPORT_ENABLED:-true}"
    volumes:
      - sqlite-data:/app/data
      - type: bind
        source: ./tmp/cardJsonData
        target: /seed
        read_only: true
        bind:
          create_host_path: false

  frontend:
    build:
      context: ./frontend
    depends_on:
      - app
    ports:
      - "${FRONTEND_PORT:-3000}:80"

volumes:
  sqlite-data:
